<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sakuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>
    <linearGradient id="sakuraEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C9E" />
      <stop offset="100%" stop-color="#FF8FB8" />
    </linearGradient>
  </defs>
  <!-- Background circle with soft border -->
  <circle cx="256" cy="256" r="240" fill="url(#sakuraBg)" stroke="#FFA8CA" stroke-width="12"/>
  
  <!-- Ears -->
  <ellipse cx="184" cy="144" rx="40" ry="112" fill="url(#sakuraEar)" transform="rotate(-12 184 144)"/>
  <ellipse cx="184" cy="144" rx="20" ry="72" fill="#FFF5F8" transform="rotate(-12 184 144)"/>
  <ellipse cx="328" cy="144" rx="40" ry="112" fill="url(#sakuraEar)" transform="rotate(12 328 144)"/>
  <ellipse cx="328" cy="144" rx="20" ry="72" fill="#FFF5F8" transform="rotate(12 328 144)"/>
  
  <!-- Face -->
  <circle cx="256" cy="304" r="144" fill="#FFFFFF" stroke="#FFD6E8" stroke-width="6"/>
  
  <!-- Rosy cheeks -->
  <circle cx="168" cy="336" r="28" fill="#FFA8CA" opacity="0.85"/>
  <circle cx="344" cy="336" r="28" fill="#FFA8CA" opacity="0.85"/>
  
  <!-- Eyes -->
  <ellipse cx="200" cy="288" rx="16" ry="24" fill="#3A1C28"/>
  <circle cx="208" cy="280" r="8" fill="#FFFFFF"/>
  <circle cx="196" cy="296" r="4" fill="#FFFFFF"/>
  <ellipse cx="312" cy="288" rx="16" ry="24" fill="#3A1C28"/>
  <circle cx="320" cy="280" r="8" fill="#FFFFFF"/>
  <circle cx="308" cy="296" r="4" fill="#FFFFFF"/>
  
  <!-- Cute mouth & nose -->
  <polygon points="256,312 250,320 262,320" fill="#FF5C9E" />
  <path d="M 240 326 Q 256 342 272 326" stroke="#3A1C28" stroke-width="14" fill="none" stroke-linecap="round"/>
